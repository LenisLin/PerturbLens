name: perturblens
title: PerturbLens
repository: https://github.com/LenisLin/PerturbLens
one_liner: Response-centric characterization of cellular perturbation information across context, target, intervention, readout, and combination boundaries.
domain: Computational biology; perturbation response characterization and virtual-cell evaluation
stage: See docs/governance/state.md
owner: LenisLin
license: unknown
entrypoints:
  - python -m pip install -e ".[dev]"
primary_sources:
  - LINCS transcriptomics
  - scPerturb transcriptomics
planned_source_classes:
  - matched perturbational morphology / Cell Painting
  - genetic and chemical combination datasets
state_representations:
  transcriptomics:
    - Gene
    - Pathway
    - FM
  morphology:
    - CellProfiler
    - DeepMorphology
response_views:
  - Delta
  - SystemaResidual
evaluation_families:
  - population_similarity
  - instance_retrieval
  - model_prediction
results:
  - r1_framework
  - r2_genetic
  - r3_chemical
  - r4_cross_intervention
  - r5_cross_readout
  - r6_combination
components:
  - docs/
  - scripts/fm_extractors/
  - src/perturblens/
  - tests/
